name: Hessflix verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: '11.25.0'
          run_install: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm security:publication
      - run: pnpm test:publication
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm test:rules
      - name: Build the isolated static demo
        run: pnpm build:demo
      - name: Upload only the public demo
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: output/github-pages
  deploy-demo:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: hessflix-pages
      cancel-in-progress: false
    steps:
      - name: Publish the portfolio demo
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
